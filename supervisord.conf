[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:telegram-bot-api]
command=/usr/local/bin/telegram-bot-api --local --api-id=%(ENV_API_ID)s --api-hash=%(ENV_API_HASH)s --http-port=8081 --dir=/var/lib/telegram-bot-api --verbosity=1
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
command=python -u /app/bot.py
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
